# Netlify builds only the Expo web frontend. FastAPI must run on a separate host.
[build]
  base = "frontend"
  command = "yarn install --frozen-lockfile && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Expo Router client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
